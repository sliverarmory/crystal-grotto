# SPDX-License-Identifier: GPL-3.0-only
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit, E2E, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true

      - name: Verify module metadata and downloads
        run: |
          go mod tidy -diff
          go mod verify

      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            printf 'The following files need gofmt:\n%s\n' "$files" >&2
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Run unit and deterministic E2E tests
        run: go test -count=1 ./...

      - name: Build command
        run: go build -trimpath -o "${RUNNER_TEMP}/crystal-grotto" ./cmd/crystal-grotto

  race-core:
    name: Race detector (core packages)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true

      - name: Run core race tests
        shell: bash
        run: |
          mapfile -t packages < <(go list ./... | grep -Ev '/internal/(blockparty|btf|engine|hookencode|hookresolve|hooks|intrinsicexpand|ised|mutate|regdance|resolver|rulegen|safety|shatter|transfer|unwindgen|x86)$')
          go test -race -p=2 -count=1 "${packages[@]}"

  race-transforms:
    name: Race detector (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86 decoder
            package: ./internal/x86
            test: '^TestCapstoneConcurrentUse$'
          - name: easy PIC
            package: ./internal/btf
            test: '^TestFixConcurrentCallsOnOneObject$'
          - name: mutation
            package: ./internal/mutate
            test: '^TestApplyConcurrentIndependentObjects$'
          - name: register dance
            package: ./internal/regdance
            test: '^TestApplyConcurrentCalls$'
          - name: hook encoder
            package: ./internal/hookencode
            test: '^TestConcurrentApplyDeterministic$'
          - name: hook resolver intrinsic
            package: ./internal/hookresolve
            test: '^TestApplyConcurrentDeterminism$'
          - name: user intrinsic expansion
            package: ./internal/intrinsicexpand
            test: '^TestApplyConcurrentDeterminism$'
          - name: hook model
            package: ./internal/hooks
            test: '^TestConcurrentQueriesAndTransactionalApply$'
          - name: resolver
            package: ./internal/resolver
            test: '^(TestApplyBuiltinIsConcurrentAndDeterministic|TestConfigurationAndPlanningAreConcurrentReadSafe)$'
          - name: rule generation
            package: ./internal/rulegen
            test: '^TestGenerateConcurrentDeterminism$'
          - name: safety graph
            package: ./internal/safety
            test: '^TestGraphConcurrentChecks$'
          - name: ISED planning
            package: ./internal/ised
            test: '^(TestConfigurationAndPlanningAreConcurrentReadSafe|TestApplyObjectConcurrentReadSafe)$'
          - name: block party
            package: ./internal/blockparty
            test: '^TestFactoryLifecycleCancellationAndConcurrentUse$'
          - name: shatter
            package: ./internal/shatter
            test: '^TestApplyConcurrentIndependentObjects$'
          - name: transfer intrinsic
            package: ./internal/transfer
            test: '^TestLifecycleCancellationValidationAndConcurrency$'
          - name: unwind generation
            package: ./internal/unwindgen
            test: '^TestCancellationFactoryLifecycleAndConcurrentUse$'
          - name: engine
            package: ./internal/engine
            test: '^TestHandlerCanServeIndependentExecutionsConcurrently$'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true

      - name: Run focused race test
        run: go test -race -count=1 -run "${{ matrix.test }}" "${{ matrix.package }}"

  compatibility:
    name: Crystal Palace compatibility
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TZ: UTC

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Install compatibility toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ant mingw-w64

      - name: Fetch and build pinned Crystal Palace
        run: ./scripts/fetch-crystal-palace.sh "${RUNNER_TEMP}/crystal-palace"

      - name: Build Crystal Grotto
        run: go build -trimpath -o "${RUNNER_TEMP}/crystal-grotto" ./cmd/crystal-grotto

      - name: Run upstream compatibility tests
        env:
          CRYSTAL_PALACE_JAR: ${{ runner.temp }}/crystal-palace/cpsrc/build/crystalpalace.jar
          CRYSTAL_GROTTO_BIN: ${{ runner.temp }}/crystal-grotto
        run: go test -tags=compat -count=1 ./...
